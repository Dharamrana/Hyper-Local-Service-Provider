spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hlsp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

server.port=${PORT:8080}

logging.level.org.springframework=INFO
logging.level.com.urbancompany=DEBUG

# --- HLSP market integrations ---
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-id=${WHATSAPP_PHONE_ID:}
app.default-city=${DEFAULT_CITY:Premnagar, Dehradun}
app.default-lat=${DEFAULT_LAT:30.3429}
app.default-lng=${DEFAULT_LNG:77.9620}
app.maps.google-key=${GOOGLE_MAPS_API_KEY:}
management.endpoints.web.exposure.include=health,info
