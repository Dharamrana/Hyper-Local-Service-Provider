<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — UrbanService</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f6bff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header>
    <div class="container">
        <a href="/" class="logo">
            <i class="fas fa-tools"></i>
            <span>UrbanService</span>
        </a>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="/request">Book Service</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
        <button type="button" class="btn btn-outline btn-sm hlsp-lang-toggle" onclick="HLSPLang.cycle(this)" style="margin-right:8px">हिंदी | Hinglish</button>
        <div class="auth-buttons">
            <a href="/login" class="btn btn-outline">Log in</a>
            <a href="/signup" class="btn btn-primary">Sign up</a>
        </div>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1>Create your account</h1>
        <p>One account for booking, tracking and ratings</p>
    </div>
</section>

<section class="booking-form-section">
    <div class="container">
        <div class="booking-form-container">
            <form id="signupForm" class="booking-form" onsubmit="return false;">
                <div id="signupError" class="auth-error" style="display:none"></div>
                <label style="display:block;font-weight:600;margin-bottom:8px">I am joining as</label>
                <div class="hlsp-role-grid" role="radiogroup" aria-label="Select your role">
                    <button type="button" class="hlsp-role-card active" data-role="CUSTOMER" onclick="hlspSetRole(this)"><i class="fas fa-user"></i><b>Customer</b><small>Book services</small></button>
                    <button type="button" class="hlsp-role-card" data-role="PROVIDER" onclick="hlspSetRole(this)"><i class="fas fa-tools"></i><b>Service Provider</b><small>Get jobs &amp; earn</small></button>
                    <button type="button" class="hlsp-role-card" data-role="ADMIN" onclick="hlspSetRole(this)"><i class="fas fa-shield-alt"></i><b>Admin</b><small>Manage platform</small></button>
                </div>
                <p id="roleHint" class="hlsp-map-label" style="margin-bottom:14px">Customer: browse &amp; book trusted local pros.</p>
                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full name</label>
                            <input type="text" id="name" required autocomplete="name" placeholder="Your name">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone number</label>
                            <input type="tel" id="phone" required autocomplete="tel" placeholder="98765 43210">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
                    </div>
                    <div class="form-group" id="providerServiceRow" style="display:none">
                        <label for="providerService">Your main service (KYC verification required before jobs)</label>
                        <select id="providerService">
                            <option>Electrician</option><option>Plumber</option><option>Carpenter</option>
                            <option>House Cleaning</option><option>AC Repair</option><option>Appliance Repair</option>
                            <option>Painter</option><option>Massage Therapist</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">Password (min 6 characters)</label>
                        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="Create a password">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-primary btn-lg" style="width:100%" onclick="submitSignup()">Create account</button>
                    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
                </div>
            </form>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2024 UrbanService. All rights reserved.</p>
        </div>
    </div>
</footer>

<script>
function submitSignup() {
    var err = document.getElementById('signupError');
    err.style.display = 'none';
    var payload = {
        role: (typeof HLSP_ROLE !== 'undefined' ? HLSP_ROLE : 'CUSTOMER'),
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };
    fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
        .then(function(response) {
            if (!response.ok) {
                return response.json().then(function(body) {
                    throw new Error(body.message || 'Sign up failed');
                });
            }
            return response.json();
        })
        .then(function(data) {
            var qs = new URLSearchParams(window.location.search);
            var next = qs.get('next') || (data.role === 'PROVIDER' ? '/provider-portal' : data.role === 'ADMIN' ? '/admin' : '/');
            window.location.href = next;
        })
        .catch(function(e) {
            err.textContent = e.message;
            err.style.display = 'block';
        });
}
</script>
<script>
var HLSP_ROLE = new URLSearchParams(window.location.search).get('role') || 'CUSTOMER';
var ROLE_HINTS = {
    CUSTOMER: 'Customer: browse & book trusted local pros.',
    PROVIDER: 'Service Provider: log in to your Partner Portal - jobs, OTP start, wallet & earnings.',
    ADMIN: 'Admin: log in to the Admin Dashboard - KYC verification, providers, platform analytics.'
};
function hlspSetRole(btn) {
    document.querySelectorAll('.hlsp-role-card').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    HLSP_ROLE = btn.dataset.role;
    var hint = document.getElementById('roleHint');
    var svc = document.getElementById('providerServiceRow');
    if (svc) svc.style.display = (HLSP_ROLE === 'PROVIDER') ? 'block' : 'none';
    if (hint) hint.textContent = ROLE_HINTS[HLSP_ROLE];
}
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.hlsp-role-card').forEach(function(b){
        if (b.dataset.role === HLSP_ROLE) hlspSetRole(b);
    });
});
</script>
<script src="/js/pwa.js"></script>
<script src="/js/i18n.js"></script>
</body>
</html>
